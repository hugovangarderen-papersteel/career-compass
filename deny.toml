# Licence gate (MIT project). Permissive licences pass; MPL-2.0 is allowed only as an unmodified
# library dependency. GPL/AGPL/SSPL/EUPL never enter the Rust build: the two approved GPL components
# (PostGIS, Piper) run as separate programs and are listed in README.md.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
