name: release

# A tag v* builds the universal (Apple silicon + Intel) app and puts the .dmg on a DRAFT release.
# Hugo publishes the draft; nothing reaches her Mac before that.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: Build
        working-directory: crates/web/src-tauri
        env:
          # Public server address (the tunnel hostname), set as a repository variable.
          CC_API_URL: ${{ vars.CC_API_URL }}
          # Signs the update bundle (.app.tar.gz -> .sig). Key pair made 2026-11-24; private half
          # only here and in Hugo's password manager. Losing it means no more updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target universal-apple-darwin
      - name: Gatekeeper probe (records what she will see on first open)
        continue-on-error: true
        run: |
          APP=$(find target/universal-apple-darwin/release/bundle/macos -name '*.app' -maxdepth 1 | head -1)
          codesign -dv --verbose=2 "$APP" 2>&1 | tee gatekeeper.txt
          spctl --assess --type execute -vv "$APP" 2>&1 | tee -a gatekeeper.txt || echo "spctl: rejected (expected for ad-hoc signing)" | tee -a gatekeeper.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DMG=$(find target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          TGZ=$(find target/universal-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -1)
          cp "$TGZ" CareerCompass_universal.app.tar.gz
          cp "$TGZ.sig" CareerCompass_universal.app.tar.gz.sig
          # Static update manifest; the installed app reads releases/latest/download/latest.json,
          # which only resolves to a PUBLISHED release. One universal bundle serves both arches.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CareerCompass_universal.app.tar.gz"
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg s "$(cat CareerCompass_universal.app.tar.gz.sig)" --arg u "$URL"             '{version:$v, notes:"", pub_date:$d, platforms:{"darwin-aarch64":{signature:$s,url:$u},"darwin-x86_64":{signature:$s,url:$u}}}' > latest.json
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Career Compass $TAG" --notes "Draft build. Publish to make it installable."
          gh release upload "$TAG" "$DMG" gatekeeper.txt CareerCompass_universal.app.tar.gz CareerCompass_universal.app.tar.gz.sig latest.json --clobber
