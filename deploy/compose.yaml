# Runs on the lab server as its own Compose project, separate from the lab stack:
#   docker compose -p career-compass --env-file deploy/.env -f deploy/compose.yaml up -d
# Deploying needs the owner's go. Postgres has no published port; only the api is reachable.
name: career-compass

services:
  db:
    image: postgres:16 # Phase 1 swaps in an image with pgvector + PostGIS
    restart: unless-stopped
    environment:
      POSTGRES_DB: cc
      POSTGRES_USER: cc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [cc]
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cc -d cc"]
      interval: 10s
      retries: 10

  api:
    image: career-compass-api:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cc:${POSTGRES_PASSWORD}@db:5432/cc
      CC_JWT_SECRET: ${CC_JWT_SECRET:?set in deploy/.env}
      CC_ADMIN_TOKEN: ${CC_ADMIN_TOKEN:?set in deploy/.env}
      CC_BIND: 0.0.0.0:8080
      CC_WEB_DIR: /srv/web
      # Kompas: a real key in deploy/.env, or the canned test model for test accounts only:
      #   CC_ANTHROPIC_API_KEY=mock  CC_ANTHROPIC_URL=http://mock:9000  CC_MOCK_MODEL=1  COMPOSE_PROFILES=mock
      CC_ANTHROPIC_API_KEY: ${CC_ANTHROPIC_API_KEY:-}
      CC_ANTHROPIC_URL: ${CC_ANTHROPIC_URL:-https://api.anthropic.com}
      CC_MOCK_MODEL: ${CC_MOCK_MODEL:-0}
      # Test track: real accounts see Kompas offline until Hugo's go sets this to 0.
      CC_INTAKE_TEST_ONLY: ${CC_INTAKE_TEST_ONLY:-1}
      # Push-to-talk: the stt service below. Empty turns the mic off (503 stt_offline).
      CC_STT_URL: ${CC_STT_URL-http://stt:8000}
      CC_STT_MODEL: ${CC_STT_MODEL:-Systran/faster-whisper-small}
    networks: [cc]
    mem_limit: 512m # a 10 MB PDF is parsed in memory

  mock:
    profiles: [mock]
    image: career-compass-api:local # the api image, built once
    depends_on: [api]
    restart: unless-stopped
    command: cc-mock-model
    networks: [cc]
    mem_limit: 64m

  # Speech to text for push-to-talk (speaches, MIT; model faster-whisper-small, MIT). On the
  # internal network only, no published port. Language is detected per clip. The model is
  # downloaded once into the volume after the first start (see README, Deploy).
  stt:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    volumes:
      - hf-hub-cache:/home/ubuntu/.cache/huggingface/hub
    networks: [cc]
    mem_limit: 2g

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://api:8080
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set in deploy/.env}
    depends_on: [api]
    networks: [cc]
    mem_limit: 128m

networks:
  cc: {}

volumes:
  db: {}
  hf-hub-cache: {}
